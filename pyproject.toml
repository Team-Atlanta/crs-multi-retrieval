[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crs-multi-retrieval"
version = "1.0.0"
description = "CRS using Multi Retrieval LangGraph agent for autonomous vulnerability patching"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-litellm>=0.7,<1",
    "langgraph>=1.0,<2",
    "litellm>=1.90,<2",
    "ast-grep-py>=0.39,<1",
    "pydantic>=2.10,<3",
]

[project.scripts]
run_patcher = "patcher:main"

[tool.setuptools]
py-modules = ["patcher"]

[tool.setuptools.packages.find]
include = ["agents", "agents.*", "crete", "crete.*"]

[tool.setuptools.package-data]
agents = ["*.md"]
